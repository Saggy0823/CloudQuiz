AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudQuiz - Cloud-Native Online Examination System

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        QUIZ_TABLE: !Ref QuizTable
        RESULTS_TABLE: !Ref ResultsTable
        ATTEMPTS_TABLE: !Ref AttemptsTable

Resources:

  # ==========================================
  # 1. DATABASE
  # ==========================================

  QuizTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudQuiz-Quizzes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quizId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: quizId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerCreatedAtIndex
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudQuiz-Results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resultId
          AttributeType: S
        - AttributeName: quizId
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: resultId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: QuizSubmittedAtIndex
          KeySchema:
            - AttributeName: quizId
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudQuiz-Attempts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: attemptKey
          AttributeType: S
      KeySchema:
        - AttributeName: attemptKey
          KeyType: HASH

  # ==========================================
  # 2. COGNITO AUTHENTICATION
  # ==========================================

  CloudQuizUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: CloudQuiz-Users-V2
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CloudQuizUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: CloudQuiz-Web-Client
      UserPoolId: !Ref CloudQuizUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ==========================================
  # 3. API GATEWAY
  # ==========================================

  CloudQuizApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - https://saggy0823.github.io
          - http://localhost:5500
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub
                - https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}
                - PoolId: !Ref CloudQuizUserPool
              audience:
                - !Ref CloudQuizUserPoolClient

  # ==========================================
  # 4. LAMBDA BACKEND
  # ==========================================

  CloudQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudQuizBackendV2
      CodeUri: ../backend/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuizTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AttemptsTable

      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /health
            Method: GET

        GetQuizzes:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /quizzes
            Method: GET

        SubmitQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /submit
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

        CreateTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

        MyTests:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /my-tests
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        AccessTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests/access
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

        GetTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests/{testId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        TestResults:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests/{testId}/results
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

        ManageTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests/{testId}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer

        DeleteTest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudQuizApi
            Path: /tests/{testId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

# ==========================================
# 5. OUTPUTS
# ==========================================

Outputs:

  ApiUrl:
    Description: CloudQuiz API Gateway URL
    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/prod
      - ApiId: !Ref CloudQuizApi

  QuizTableName:
    Description: DynamoDB quiz table
    Value: !Ref QuizTable

  ResultsTableName:
    Description: DynamoDB results table
    Value: !Ref ResultsTable

  AttemptsTableName:
    Description: DynamoDB attempts table
    Value: !Ref AttemptsTable

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CloudQuizUserPool

  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref CloudQuizUserPoolClient
