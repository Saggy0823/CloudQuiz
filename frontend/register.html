<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CloudQuiz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; color: #172033; }
        .container { max-width: 420px; margin: 65px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 18px #0001; }
        h2 { text-align: center; }
        input { width: 100%; padding: 12px; margin: 9px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; }
        button { width: 100%; padding: 13px; margin-top: 12px; background: #2563eb; color: white; border: 0; border-radius: 5px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        .hidden { display: none; }
        .message { margin-top: 12px; text-align: center; white-space: pre-wrap; }
        a { color: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create CloudQuiz Account</h2>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password (minimum 8 characters)" minlength="8" required>
        <button type="submit" id="registerBtn">Register</button>
    </form>

    <form id="verifyForm" class="hidden">
        <p>Enter the verification code sent to your email.</p>
        <input type="text" id="code" placeholder="Email verification code" required>
        <button type="submit" id="verifyBtn">Verify Email</button>
        <button type="button" id="resendBtn">Resend Code</button>
    </form>

    <div class="message" id="message"></div>

    <p style="text-align:center">
        Already registered? <a href="login.html">Login</a>
    </p>
    <p style="text-align:center"><a href="index.html">Back to Home</a></p>
</div>

<script>
const REGION = "ap-southeast-2";
const CLIENT_ID = "489b0452mtogi849rlr728idle";

const registerForm = document.getElementById("registerForm");
const verifyForm = document.getElementById("verifyForm");
const message = document.getElementById("message");

let pendingEmail = "";
let pendingName = "";

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "green" : "red";
}

async function cognitoRequest(action, payload) {
    const response = await fetch(
        `https://cognito-idp.${REGION}.amazonaws.com/`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-amz-json-1.1",
                "X-Amz-Target": `AWSCognitoIdentityProviderService.${action}`
            },
            body: JSON.stringify(payload)
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || data.Message || "Cognito request failed.");
    }

    return data;
}

registerForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("registerBtn");
    button.disabled = true;
    showMessage("Creating your account...");

    pendingName = document.getElementById("name").value.trim();
    pendingEmail = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    try {
        await cognitoRequest("SignUp", {
            ClientId: CLIENT_ID,
            Username: pendingEmail,
            Password: password,
            UserAttributes: [
                { Name: "email", Value: pendingEmail },
                { Name: "name", Value: pendingName }
            ]
        });

        registerForm.classList.add("hidden");
        verifyForm.classList.remove("hidden");
        showMessage("Account created! Check your email for the verification code.", true);

    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
});

verifyForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("verifyBtn");
    button.disabled = true;
    showMessage("Verifying your email...");

    const code = document.getElementById("code").value.trim();

    try {
        await cognitoRequest("ConfirmSignUp", {
            ClientId: CLIENT_ID,
            Username: pendingEmail,
            ConfirmationCode: code
        });

        showMessage("Email verified successfully! Redirecting to login...", true);

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
});

document.getElementById("resendBtn").addEventListener("click", async function() {
    const button = this;
    button.disabled = true;

    try {
        await cognitoRequest("ResendConfirmationCode", {
            ClientId: CLIENT_ID,
            Username: pendingEmail
        });
        showMessage("A new verification code has been sent.", true);
    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
