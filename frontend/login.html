<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudQuiz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; color: #172033; }
        .container { max-width: 420px; margin: 70px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 18px #0001; }
        h2 { text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; }
        button { width: 100%; padding: 13px; margin-top: 12px; background: #2563eb; color: white; border: 0; border-radius: 5px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        .message { margin-top: 15px; text-align: center; white-space: pre-wrap; }
        a { color: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <h2>CloudQuiz Login</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Login</button>
    </form>

    <p style="text-align:center">
        <a href="#" id="forgotLink">Forgot Password?</a>
    </p>

    <form id="resetForm" hidden>
        <h3>Reset Password</h3>
        <input type="email" id="resetEmail" placeholder="Registered email" required>
        <button type="submit">Send Reset Code</button>
    </form>

    <form id="confirmResetForm" hidden>
        <input type="text" id="resetCode" placeholder="Email reset code" required>
        <input type="password" id="newPassword" placeholder="New password (minimum 8 characters)" minlength="8" required>
        <button type="submit">Change Password</button>
    </form>

    <div class="message" id="message"></div>

    <p style="text-align:center">
        New user? <a href="register.html">Create Account</a>
    </p>
    <p style="text-align:center"><a href="index.html">Back to Home</a></p>
</div>

<script>
const REGION = "ap-southeast-2";
const CLIENT_ID = "489b0452mtogi849rlr728idle";

const message = document.getElementById("message");
const loginForm = document.getElementById("loginForm");
const resetForm = document.getElementById("resetForm");
const confirmResetForm = document.getElementById("confirmResetForm");

let resetEmail = "";

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "green" : "red";
}

async function cognitoRequest(action, payload) {
    const response = await fetch(
        `https://cognito-idp.${REGION}.amazonaws.com/`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-amz-json-1.1",
                "X-Amz-Target": `AWSCognitoIdentityProviderService.${action}`
            },
            body: JSON.stringify(payload)
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || data.Message || "Authentication failed.");
    }

    return data;
}

// Login
loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("loginBtn");
    button.disabled = true;
    showMessage("Signing in...");

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    try {
        const data = await cognitoRequest("InitiateAuth", {
            AuthFlow: "USER_PASSWORD_AUTH",
            ClientId: CLIENT_ID,
            AuthParameters: {
                USERNAME: email,
                PASSWORD: password
            }
        });

        const auth = data.AuthenticationResult;

        if (!auth || !auth.IdToken) {
            throw new Error("Login requires an additional authentication step.");
        }

        // Store tokens for the current browser session only.
        sessionStorage.setItem("cq_id_token", auth.IdToken);
        sessionStorage.setItem("cq_access_token", auth.AccessToken);
        sessionStorage.setItem("cq_refresh_token", auth.RefreshToken || "");
        sessionStorage.setItem("cq_token_expiry", String(Date.now() + auth.ExpiresIn * 1000));
        sessionStorage.setItem("cq_user_email", email);

        showMessage("Login successful! Redirecting...", true);

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);

    } catch (error) {
        showMessage(error.message);
    } finally {
        button.disabled = false;
    }
});

// Show password reset form
document.getElementById("forgotLink").addEventListener("click", function(event) {
    event.preventDefault();
    loginForm.hidden = true;
    resetForm.hidden = false;
    showMessage("");
});

// Request password reset code
resetForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    resetEmail = document.getElementById("resetEmail").value.trim().toLowerCase();

    try {
        await cognitoRequest("ForgotPassword", {
            ClientId: CLIENT_ID,
            Username: resetEmail
        });

        resetForm.hidden = true;
        confirmResetForm.hidden = false;
        showMessage("Password reset code sent to your email.", true);

    } catch (error) {
        showMessage(error.message);
    }
});

// Confirm password reset
confirmResetForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    try {
        await cognitoRequest("ConfirmForgotPassword", {
            ClientId: CLIENT_ID,
            Username: resetEmail,
            ConfirmationCode: document.getElementById("resetCode").value.trim(),
            Password: document.getElementById("newPassword").value
        });

        confirmResetForm.hidden = true;
        loginForm.hidden = false;
        showMessage("Password changed successfully. Please log in.", true);

    } catch (error) {
        showMessage(error.message);
    }
});
</script>

</body>
</html>
